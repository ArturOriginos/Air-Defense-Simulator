<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020a04">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Air Defense Simulator</title>
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="money"></span><span id="hp"></span>
  <span id="ammo"></span><span id="foul"></span><span id="kills"></span><span id="expo"></span>
</div>
<div id="msg"></div>
<div id="panel">
  <div class="row"><button id="shopBtn"></button><button id="gear">⚙</button></div>
  <h4 data-t="svcH"></h4><div id="sv" class="grid g3"></div>
  <h4 data-t="upg"></h4><div id="up" class="grid"></div>
</div>
<div id="shop" class="ov" hidden>
  <div class="shead"><b id="smoney"></b><button id="sclose" data-t="close"></button></div>
  <div id="slist"></div>
</div>
<div id="menu" class="ov">
  <img id="logo" src="img/logo.jpg" alt="Air Defense Simulator">
  <h1 class="sr" data-t="title"></h1>
  <p data-t="intro"></p>
  <button data-k="s300" id="mS300"></button>
  <button data-k="osa" id="mOsa"></button>
  <button id="gearM"><b data-t="setB"></b></button>
  <p id="best"></p>
</div>
<div id="over" class="ov" hidden>
  <h1 data-t="over"></h1>
  <p id="stats"></p>
  <button id="again"><b data-t="again"></b></button>
</div>
<div id="set" class="ov" hidden>
  <h1 data-t="set"></h1>
  <p data-t="lang"></p>
  <button data-l="auto"><b data-t="auto"></b></button>
  <button data-l="ru"><b>Русский</b></button>
  <button data-l="en"><b>English</b></button>
  <button id="setClose"><b data-t="close"></b></button>
</div>
<script src="game.js"></script>
</body>
</html>
