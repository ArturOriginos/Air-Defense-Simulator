name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html style.css game.js www/
      - run: npx cap add android
      - name: App icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/res/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Portrait + fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/Theme.AppCompat.Light.NoActionBar/Theme.AppCompat.NoActionBar/' android/app/src/main/res/values/styles.xml || true
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: air-defense-simulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Air Defense Simulator (APK)
          files: android/app/build/outputs/apk/debug/app-debug.apk
